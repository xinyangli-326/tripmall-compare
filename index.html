<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2f6e">
<title>携程服务市场 · 采购比价小助手</title>
<style>
:root{
  --bg:#eef1f6; --card:#fff; --line:#e3e8ef; --line2:#eef2f7;
  --tx:#131a24; --tx2:#576272; --tx3:#8e9aa9;
  --pri:#1554c0; --pri-bg:#ecf2fe;
  --ok:#0a7c53; --ok-bg:#e5f6ee;
  --amber:#b8730a; --amber-bg:#fdf3e3;
  --bad:#c0392b;
  --trial:#7040cf; --trial-bg:#f2ecfe;
  --sh:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.05);
  --sh2:0 8px 28px rgba(16,24,40,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--tx);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
::selection{background:#cfe0ff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cbd3de;border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============ 整屏骨架：页面本身不滚动 ============ */
.app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{flex:0 0 auto;background:linear-gradient(135deg,#0a2a63,#1554c0 62%,#1e6ae0);color:#fff;
  padding:11px 18px;box-shadow:0 2px 12px rgba(10,42,99,.2);z-index:30}
.top .r1{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-size:16.5px;font-weight:800;letter-spacing:.3px}
.logo .mk{width:21px;height:21px;border-radius:6px;background:linear-gradient(135deg,#ffd166,#ff9f1c);display:grid;place-items:center;font-size:12.5px;color:#7a3d00}
.chip-brand{font-size:11px;font-weight:700;background:rgba(255,255,255,.2);border-radius:6px;padding:3px 8px}
.topmeta{font-size:12px;color:#b9cdf2;margin-left:auto;display:flex;align-items:center;gap:6px}
.topmeta .dot{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.22)}
.kbtn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);
  border-radius:9px;padding:6px 11px;color:#dbe7fb;font-size:12.5px;transition:.18s}
.kbtn:hover{background:rgba(255,255,255,.24)}
.kbtn kbd{font:inherit;font-size:10.5px;background:rgba(255,255,255,.2);border-radius:4px;padding:1px 5px}
/* 顶栏搜索框（百度式：结果页也带搜索框） */
.topsearch{position:relative;display:flex;align-items:stretch;flex:1;max-width:560px;min-width:220px;
  background:#fff;border-radius:10px;overflow:visible;box-shadow:0 2px 10px rgba(8,24,56,.18)}
.topsearch>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--tx3);z-index:1}
.topsearch input{flex:1;border:0;outline:0;padding:9px 10px 9px 34px;font-size:14px;border-radius:10px 0 0 10px;min-width:0;background:transparent}
.topsearch .go{background:linear-gradient(135deg,#1e6ae0,#1554c0);color:#fff;font-size:13.5px;font-weight:800;padding:0 18px;border-radius:0 10px 10px 0;white-space:nowrap}
.topsearch .go:hover{background:linear-gradient(135deg,#1554c0,#0d2f6e)}
.tdrop{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--sh2);overflow:hidden;z-index:40;display:none;max-height:60vh;overflow-y:auto;color:var(--tx)}
.tdrop.on{display:block}

.wrap{flex:1;min-height:0;display:grid;grid-template-columns:246px minmax(0,1fr);gap:13px;
  padding:13px 18px;overflow:hidden;width:100%;max-width:1960px;margin:0 auto}
.wrap.single{grid-template-columns:minmax(0,1fr)}
.pane{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);
  display:flex;flex-direction:column;min-height:0;overflow:hidden}
.phead{flex:0 0 auto;border-bottom:1px solid var(--line2)}
.pbody{flex:1;min-height:0;overflow:auto}
.pfoot{flex:0 0 auto;border-top:1px solid var(--line2);background:#fafbfd;border-radius:0 0 14px 14px}

/* ============ 左：品类导航 ============ */
.navsearch{padding:9px 10px;display:flex;gap:7px;align-items:center}
.si{position:relative;flex:1}
.si svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--tx3)}
.si input{width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 9px 7px 27px;outline:0;background:#fafbfd;font-size:12.5px;transition:.16s}
.si input:focus{border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px rgba(21,84,192,.1)}
.navfilt{padding:0 10px 9px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.mini{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 9px;font-size:11.5px;font-weight:700;color:var(--tx2);transition:.15s}
.mini:hover{border-color:#c3d2ea;background:#f8fafd}
.mini.on{background:var(--pri);border-color:var(--pri);color:#fff}
.mini.sel{padding:4px 6px;font-weight:600}
.navlist{padding:5px 7px 7px}
.nitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border-radius:9px;padding:9px 10px;margin-bottom:2px;transition:.14s;border:1px solid transparent}
.nitem:hover{background:#f4f7fc}
.nitem.on{background:var(--pri-bg);border-color:#cfe0ff}
.nitem img{width:38px;height:38px;border-radius:9px;object-fit:cover;background:#e9eef5;flex:0 0 auto}
.nitem img.empty{visibility:hidden}
.nitem .nt{flex:1;min-width:0}
.nitem .n1{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nitem.on .n1{color:var(--pri)}
.nitem .n2{font-size:12px;color:var(--tx3);white-space:nowrap;margin-top:3px}
.nitem .np{font-size:14px;font-weight:800;color:var(--ok);font-variant-numeric:tabular-nums;flex:0 0 auto}
.nitem .np small{font-size:10.5px;font-weight:700;color:var(--tx3)}
/* 三级类目树 */
.cascade{display:flex;flex-direction:column;gap:5px;padding:0 10px 9px}
.csel{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;font-weight:700;
  color:var(--tx2);background:#fff;outline:0;transition:.15s;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  padding-right:26px}
.csel:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(21,84,192,.1)}
.csel.active{border-color:var(--pri);color:var(--pri);background-color:#f6f9ff}
.csel:disabled{opacity:.5;background:#f7f8fa}
.advToggle{display:none}
.lv1row,.lv2row{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border-radius:8px;
  transition:.14s;color:var(--tx2)}
.lv1row{margin-top:3px;padding:8px 9px;font-size:13px;font-weight:800;background:#f6f8fc}
.lv1row:hover{background:#eef3fb}
.lv1row.on{background:#e8f0fe;color:var(--pri)}
.lv2row{padding:6px 9px 6px 20px;font-size:12.5px;font-weight:700}
.lv2row:hover{background:#f6f9fd}
.lv2row.on{color:var(--pri)}
.lv1row .cv,.lv2row .cv{width:12px;height:12px;flex:0 0 auto;color:var(--tx3);transition:transform .2s}
.lv1row.on .cv,.lv2row.on .cv{transform:rotate(90deg)}
.lv1row .nm,.lv2row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv1row .ct,.lv2row .ct{font-size:10.5px;font-weight:700;color:var(--tx3);flex:0 0 auto}
.lv1row.on .ct,.lv2row.on .ct{color:var(--pri)}
.nitem.lv3{padding-left:30px}
.treewrap{padding-bottom:4px;border-bottom:1px dashed var(--line2);margin-bottom:4px}

/* ============ 右：品类面板 ============ */
.chead2{padding:12px 16px;display:grid;grid-template-columns:minmax(180px,1fr) 250px minmax(130px,.8fr);gap:14px;align-items:center}
@media(max-width:1240px){.chead2{grid-template-columns:minmax(160px,1fr) 220px;}.chead2 .cband{display:none}}
.chead2 .t{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chead2 .m{font-size:12px;color:var(--tx3);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.chead2 .m b{color:var(--tx2);font-variant-numeric:tabular-nums}
.chead2 .num{font-size:24px;font-weight:900;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1}
.chead2 .num small{font-size:11.5px;font-weight:700;color:var(--tx3);letter-spacing:0;margin-left:4px}
.chead2 .who{font-size:12px;color:var(--tx2);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead2 .who b{color:var(--ok)}
/* 价格带：可直接拖动筛选 */
.band{position:relative;height:30px}
.band .viz{position:absolute;left:0;right:0;top:10px;height:10px;border-radius:5px;
  background:linear-gradient(90deg,#e3f5ec,#e3ecfa,#fbe9e7);overflow:hidden}
.band .viz i{position:absolute;top:0;width:4px;height:10px;border-radius:2px;background:#a8b7cc;transform:translateX(-50%);opacity:.7}
.band .viz i.lo{background:var(--ok);opacity:1;box-shadow:0 0 0 2px rgba(10,124,83,.16)}
.band .sel{position:absolute;top:8px;height:14px;border-radius:7px;background:rgba(21,84,192,.16);
  border:2px solid rgba(21,84,192,.55);pointer-events:none;transition:left .06s linear,width .06s linear}
.band input[type=range]{position:absolute;left:0;top:0;width:100%;height:30px;margin:0;background:none;
  pointer-events:none;-webkit-appearance:none;appearance:none;outline:0;z-index:2}
.band input[type=range]::-webkit-slider-runnable-track{height:30px;background:transparent}
.band input[type=range]::-webkit-slider-thumb{pointer-events:none;-webkit-appearance:none;width:13px;height:24px;border-radius:5px;
  background:#fff;border:2.5px solid var(--pri);box-shadow:0 2px 6px rgba(16,24,40,.28);cursor:grab;margin-top:0}
.band input[type=range]::-moz-range-thumb{pointer-events:none;width:11px;height:22px;border-radius:5px;background:#fff;border:2.5px solid var(--pri);cursor:grab}
.band{cursor:pointer;touch-action:none;user-select:none}
.band .hit{position:absolute;inset:0;z-index:3}
.band .ax{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);margin-top:1px;font-variant-numeric:tabular-nums}
.band .ax b{color:var(--pri)}
.band .hint{position:absolute;right:0;top:-15px;font-size:10px;color:var(--tx3);font-weight:600}

.toolbar{display:flex;align-items:center;gap:8px;padding:9px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line2);background:#fcfdfe}
.seg{display:inline-flex;background:#eff2f7;border-radius:9px;padding:3px;gap:2px}
.seg button{border-radius:7px;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--tx2);transition:.15s}
.seg button:hover{color:var(--tx)}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.toolbar .si{max-width:230px}
.toolbar .cnt{margin-left:auto;font-size:12px;color:var(--tx3)}
.flabel{font-size:12px;color:var(--tx3);font-weight:700}

/* 行（紧凑，一屏 15 条） */
.rows{padding:0}
.rowb{display:grid;grid-template-columns:30px 138px 50px minmax(140px,1fr) 118px 118px 116px 168px;gap:13px;align-items:center;
  padding:9px 16px;border-bottom:1px solid var(--line2);transition:.13s}
.rowb:hover{background:#f9fbff}
.rowb.best{background:linear-gradient(90deg,#f2fcf7,#fff 26%)}
.rowb .uq{display:flex;flex-direction:column;gap:2px}
.rowb .uq .v{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.3px;line-height:1.15}
.rowb .uq .v small{font-size:12px;font-weight:700;color:var(--tx3);letter-spacing:0;margin-left:3px}
.rowb.best .uq .v{color:var(--ok)}
.rowb .uq .u2{font-size:11.5px;color:var(--tx3)}
.rowb img{width:50px;height:50px;border-radius:10px;object-fit:cover;background:#e9eef5;display:block}
.rowb img.empty{visibility:hidden}
.rowb .sinfo{min-width:0;overflow:hidden}
.rowb .s1{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowb .s2{display:block;font-size:12px;color:var(--tx3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowb .s2row{display:flex;align-items:center;gap:8px;margin-top:3px;min-width:0}
.rowb .s2tx{font-size:12px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rowb .cta{font-size:12px;font-weight:800;color:var(--pri);white-space:nowrap;flex:0 0 auto;
  border-bottom:1px dashed var(--pri);padding-bottom:1px;transition:.14s}
.rowb .cta:hover{background:var(--pri-bg);border-bottom-color:transparent;text-decoration:underline}
.rowb .cta svg{width:12px;height:12px;vertical-align:-1px}
.rowb .pname{font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.supcell{display:flex;flex-direction:column;gap:4px;min-width:0}
.tiers{align-self:flex-start;font-size:11px;font-weight:800;color:var(--pri);border:1px solid #cfe0ff;
  background:#f3f8ff;border-radius:7px;padding:3px 9px;transition:.15s;white-space:nowrap}
.tiers:hover{background:var(--pri);border-color:var(--pri);color:#fff}
.gohint{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--pri);opacity:.85}
.rowb .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:0}
.rowb .meta{display:contents}     /* 桌面端：三个数字仍是行网格的直接子项 */
.rowb .pp{font-size:15px;font-weight:800;color:var(--tx)}
.rowb .pp small{font-size:11.5px;color:var(--tx3);font-weight:600}
.rowb .ppx{font-size:11px;color:var(--tx3);margin-top:3px}
.rowb .mq{font-size:14px;color:var(--tx2)}
.rowb .mqx{font-size:11px;color:var(--tx3);margin-top:3px}
.rowb .lst{font-size:16px;font-weight:800;color:var(--pri)}
.rowb .sup{font-size:13px;color:var(--tx2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.trow{display:grid;grid-template-columns:minmax(150px,1fr) 64px 84px 132px 96px minmax(120px,1fr);gap:10px;align-items:center;
  padding:8px 14px;border-bottom:1px solid var(--line2);font-size:12.5px}
.trow:hover{background:#fafcff}
.trow.low{background:linear-gradient(90deg,#f2fcf7,#fff 26%)}
.trow .n{text-align:right;font-variant-numeric:tabular-nums}
.trow b{font-variant-numeric:tabular-nums}
.thead{display:grid;grid-template-columns:30px 138px 50px minmax(140px,1fr) 118px 118px 116px 168px;gap:13px;padding:9px 16px;
  font-size:12px;font-weight:700;color:var(--tx3);background:#f7f9fc;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
.thead span.n{text-align:right}
.thead.t{grid-template-columns:minmax(150px,1fr) 64px 84px 132px 96px minmax(120px,1fr);gap:10px}
.thead .n{text-align:right}
.theadtip{padding:9px 14px;font-size:11.5px;color:var(--tx3);background:#fbfcfe;border-bottom:1px solid var(--line2);
  display:flex;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:2}
/* 可排序表头 */
.th-sort{display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none;transition:.14s;border-radius:6px;padding:1px 4px;margin:-1px -4px}
.th-sort:hover{background:#e8eefb;color:var(--pri)}
.th-sort.on{color:var(--pri);font-weight:800}
.th-sort svg{width:11px;height:11px;opacity:.35;transition:.15s}
.th-sort:hover svg{opacity:.7}
.th-sort.on svg{opacity:1}
.th-sort .arr{font-size:9px;line-height:1;margin-left:1px}

/* 翻页条（固定底部） */
.pgbar{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:12.5px;color:var(--tx3);flex-wrap:wrap}
.pgbar b{color:var(--tx2);font-variant-numeric:tabular-nums}
.pgbar .pp{display:flex;align-items:center;gap:5px}
.pgbar select{border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:12px;outline:0;background:#fff;color:var(--tx2)}
.pgs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.pg{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:700;color:var(--tx2);transition:.15s;font-variant-numeric:tabular-nums}
.pg:hover:not(:disabled){border-color:#c3d2ea;background:#f8fafd}
.pg.on{background:var(--pri);border-color:var(--pri);color:#fff}
.pg:disabled{opacity:.38;cursor:default}
.ell{color:var(--tx3);padding:0 2px}
.pgjump{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--tx3);white-space:nowrap}
.pgin{width:60px;border:1px solid var(--line);border-radius:7px;padding:4px 7px;font-size:12.5px;text-align:center;
  outline:0;font-variant-numeric:tabular-nums;background:#fff;transition:.16s;-moz-appearance:textfield}
.pgin:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(21,84,192,.1)}
.pgin::-webkit-outer-spin-button,.pgin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.badge{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 6px;line-height:1.35;white-space:nowrap}
.b-base{background:var(--pri-bg);color:var(--pri)}
.b-low{background:var(--ok-bg);color:var(--ok)}
.b-trial{background:var(--trial-bg);color:var(--trial)}
.b-warn{background:var(--amber-bg);color:var(--amber)}
.b-mute{background:#f0f3f8;color:var(--tx3)}
.help{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;background:#dfe6f0;color:var(--tx3);
  font-size:10px;font-weight:800;cursor:help;vertical-align:1px}
.help:hover{background:var(--pri);color:#fff}
.empty{padding:44px 20px;text-align:center;color:var(--tx3);font-size:13px}

/* 供应商表 */
.suphero{padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line2)}
.suphero .nm{font-size:17px;font-weight:800}

/* 弹层 */
.pal{position:fixed;inset:0;z-index:80;background:rgba(12,20,34,.44);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:8vh 20px 20px;opacity:0;pointer-events:none;transition:.2s}
.pal.on{opacity:1;pointer-events:auto}
.palbox{width:min(760px,94vw);background:#fff;border-radius:15px;box-shadow:var(--sh2);overflow:hidden;transform:translateY(-12px);transition:.26s cubic-bezier(.2,.9,.2,1)}
.pal.on .palbox{transform:none}
.palin{display:flex;align-items:center;gap:11px;padding:14px 17px;border-bottom:1px solid var(--line2)}
.palin svg{width:19px;height:19px;color:var(--tx3)}
.palin input{flex:1;border:0;outline:0;font-size:15.5px}
.palres{max-height:56vh;overflow:auto;padding:6px}
.pit{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;cursor:pointer}
.pit:hover{background:var(--pri-bg)}
.pit img{width:32px;height:32px;border-radius:8px;object-fit:cover;background:#eef2f7;flex:0 0 auto}
.pit .tx{flex:1;min-width:0}
.pit .a{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pit .b{font-size:11.5px;color:var(--tx3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pit .c{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ok)}
.sep{font-size:11px;color:var(--tx3);padding:11px 12px 5px;font-weight:700;letter-spacing:.5px}
.mod{position:fixed;inset:0;z-index:85;background:rgba(12,20,34,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;pointer-events:none;transition:.22s}
.mod.on{opacity:1;pointer-events:auto}
.sheet{background:#fff;border-radius:16px;box-shadow:var(--sh2);width:min(680px,95vw);max-height:86vh;display:flex;flex-direction:column;
  transform:translateY(14px) scale(.985);transition:.26s cubic-bezier(.2,.9,.2,1)}
.mod.on .sheet{transform:none}
.sheet .sh{display:flex;align-items:center;gap:12px;padding:15px 19px;border-bottom:1px solid var(--line2)}
.sheet .sh h2{margin:0;font-size:16px;font-weight:800}
.sheet .sb{overflow:auto;padding:15px 19px 19px;font-size:13.5px;line-height:1.9;color:var(--tx2)}
.ibtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:700;color:var(--tx2)}
.ibtn:hover{background:#f6f9fd}
.gloss{border-left:3px solid var(--pri);background:#f7faff;border-radius:0 9px 9px 0;padding:10px 13px;margin-bottom:11px}
.gloss .gt{font-weight:800;color:var(--tx);font-size:13.5px}
.gloss .gd{margin-top:3px}
.foot{flex:0 0 auto;padding:7px 18px 9px;font-size:12px;color:var(--tx3);text-align:center}

/* 行区域：10 行自动铺满面板高度 */
#catbody.flexbody{display:flex;flex-direction:column;overflow:hidden}
#catbody.flexbody .theadtip,#catbody.flexbody .thead{flex:0 0 auto}
#catbody.flexbody .rowsbox{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
#catbody.flexbody .rowsbox .rowb{flex:1 1 auto}
.foot button{margin-left:8px}
.hide{display:none!important}

/* ============ 首页（百度式落地搜索页） ============ */
.home{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;overflow:auto;padding:36px 20px 28px}
.home .brand{display:flex;align-items:center;gap:15px;font-size:34px;font-weight:900;letter-spacing:.5px;line-height:1}
.home .brand .mk{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:28px;color:#7a3d00;
  background:linear-gradient(135deg,#ffd166,#ff9f1c);box-shadow:0 9px 24px rgba(255,159,28,.36)}
.home .slogan{margin-top:14px;font-size:14.5px;color:var(--tx3);letter-spacing:.3px}
.hsearch{margin-top:30px;width:min(780px,94vw);position:relative}
.hbar{display:flex;align-items:stretch;border:2px solid var(--pri);border-radius:14px;overflow:hidden;background:#fff;
  box-shadow:0 6px 22px rgba(21,84,192,.13);transition:.2s}
.hbar:focus-within{box-shadow:0 10px 32px rgba(21,84,192,.22)}
.hbar .ic{width:20px;height:20px;margin:auto 0 auto 17px;color:var(--tx3);flex:0 0 auto}
.hbar input{flex:1;border:0;outline:0;font-size:17px;padding:16px 14px;min-width:0}
.hbar .go{background:linear-gradient(135deg,#1e6ae0,#1554c0);color:#fff;font-size:16px;font-weight:800;padding:0 30px;transition:.18s;white-space:nowrap}
.hbar .go:hover{background:linear-gradient(135deg,#1554c0,#0d2f6e)}
.hdrop{position:absolute;left:0;right:0;top:calc(100% + 7px);background:#fff;border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--sh2);overflow:hidden;z-index:25;display:none;max-height:52vh;overflow-y:auto}
.hdrop.on{display:block}
.hit{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;transition:.12s}
.hit:hover,.hit.cur{background:var(--pri-bg)}
.hit img{width:34px;height:34px;border-radius:8px;object-fit:cover;background:#eef2f7;flex:0 0 auto}
.hit img.empty{visibility:hidden}
.hit .tx{flex:1;min-width:0}
.hit{color:var(--tx)}   /* 注意：下拉在深色顶栏里，必须显式给深色，否则继承成白字 */
.hit .a{font-weight:700;font-size:13.5px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hit .b{font-size:11.5px;color:var(--tx2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hit .c{font-size:13.5px;font-weight:800;color:var(--ok);white-space:nowrap;font-variant-numeric:tabular-nums}
.hit .k{font-size:10.5px;font-weight:800;color:var(--pri);background:var(--pri-bg);border-radius:5px;padding:2px 6px;flex:0 0 auto}
.hchips{margin-top:24px;width:min(780px,94vw);display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:center}
.hchips .lb{font-size:12.5px;color:var(--tx3);font-weight:700}
.hhist{margin-top:16px;width:min(780px,94vw);display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:center}
.hhist .lb{font-size:12.5px;color:var(--tx3);font-weight:700}
.hchip2{border:1px dashed #c9d6e8;background:#f8fbff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;
  color:var(--tx2);transition:.15s;display:inline-flex;align-items:center;gap:6px}
.hchip2:hover{border-color:var(--pri);color:var(--pri);background:#eef5ff}
.hchip2 svg{width:11px;height:11px;opacity:0;transition:.15s}
.hchip2:hover svg{opacity:.7}
.histclr{font-size:12px;color:var(--tx3);border:0;background:none;cursor:pointer;text-decoration:underline}
.histclr:hover{color:var(--pri)}
/* 百度式搜索历史下拉 */
.hlist{padding:4px 0}
.hrow{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;transition:.12s;font-size:14px}
.hrow:hover{background:#f2f6fd}
.hrow .ico{width:15px;height:15px;color:var(--tx3);flex:0 0 auto}
.hrow .hq{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx)}
.hrow .hdel{font-size:12px;color:var(--tx3);opacity:0;transition:.14s;flex:0 0 auto;padding:2px 4px}
.hrow:hover .hdel{opacity:1}
.hrow .hdel:hover{color:var(--pri)}
.hfoot{display:flex;justify-content:flex-end;gap:18px;padding:9px 16px;border-top:1px solid var(--line2);background:#fafbfd}
.hfoot button{font-size:12px;color:var(--tx3);transition:.14s}
.hfoot button:hover{color:var(--pri)}
/* 搜索设置面板 */
.setrow{display:grid;grid-template-columns:minmax(150px,1fr) auto;gap:14px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line2)}
.setrow:last-child{border-bottom:0}
.setrow .lb{font-weight:700;color:var(--tx);font-size:13.5px}
.setrow .ds{font-size:12px;color:var(--tx3);margin-top:3px;font-weight:400}
.setopts{display:flex;gap:16px;flex-wrap:wrap;justify-content:flex-end}
.setopt{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--tx2);cursor:pointer;white-space:nowrap}
.setopt input{width:15px;height:15px;accent-color:var(--pri);cursor:pointer}
.hchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 15px;font-size:13px;font-weight:600;
  color:var(--tx2);transition:.16s}
.hchip:hover{border-color:var(--pri);color:var(--pri);background:#f4f8ff;transform:translateY(-1px);box-shadow:0 3px 10px rgba(21,84,192,.1)}
.hstat{margin-top:34px;font-size:12.5px;color:var(--tx3);display:flex;gap:20px;flex-wrap:wrap;justify-content:center;align-items:center}
.hstat b{color:var(--tx2)}
.hstat a{color:var(--pri);font-weight:700;cursor:pointer}

/* 搜索结果面板里的品类小标 */
.catpill{display:inline-block;font-size:10.5px;font-weight:700;color:var(--pri);background:var(--pri-bg);border-radius:5px;padding:1px 6px;margin-right:5px}

/* 「共 N 档」标记 + 内联展开 */
.paychips{display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center;margin-left:6px}
.paychip{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 6px;white-space:nowrap;
  background:#eef7f1;color:#0a7c53;border:1px solid #cdebdc}
.paychip.syt{background:#eef4ff;color:#1554c0;border-color:#d3e2fd}
.paychip.mute{background:#f2f4f8;color:var(--tx3);border-color:var(--line)}
.payline{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--tx3);margin:9px 0 2px}
.tbadge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--pri);
  background:var(--pri-bg);border:1px solid #d3e2fd;border-radius:7px;padding:2px 7px;margin-left:7px;
  vertical-align:1px;transition:.15s;white-space:nowrap}
.tbadge:hover{background:#dbe8ff;border-color:#a9c8f8}
.tbadge svg{width:11px;height:11px;transition:transform .22s}
.tbadge.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tbadge.on svg{transform:rotate(180deg)}
.exprow{background:#f8fbff;border-bottom:1px solid var(--line2);padding:4px 16px 12px 46px;flex:0 0 auto}
.exprow .etitle{font-size:11.5px;font-weight:700;color:var(--tx3);padding:7px 0 6px;display:flex;align-items:center;gap:8px}
.exprow .etitle b{color:var(--tx2)}
.exprow table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.exprow th{text-align:left;font-size:10.5px;font-weight:700;color:var(--tx3);background:#f2f6fc;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.exprow th.n,.exprow td.n{text-align:right;font-variant-numeric:tabular-nums}
.exprow td{padding:7px 10px;border-bottom:1px solid var(--line2)}
.exprow tr:last-child td{border-bottom:0}
.exprow tr.cur{background:linear-gradient(90deg,#eafaf2,#fff)}
.exprow tr:hover{background:#fafcff}
.exprow .curmark{font-size:10px;font-weight:800;color:var(--ok);background:var(--ok-bg);border-radius:5px;padding:1px 6px;margin-left:6px}
.exprow td .ibtn{padding:4px 9px;font-size:11.5px}
.exprow img.tt40,.mini-tbl img.tt40{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#eef2f7;display:block}
.exprow img.tt40.empty,.mini-tbl img.tt40.empty{visibility:hidden}

/* ============ 交互动效 ============ */
@keyframes panelIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.anim{animation:panelIn .26s cubic-bezier(.2,.8,.25,1)}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.pop{animation:popIn .22s cubic-bezier(.2,.9,.2,1)}
.band i{transition:left .45s cubic-bezier(.2,.8,.25,1),background .2s}

.rowb{position:relative}
.rowb:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:.16s}
.rowb:hover:before{background:var(--pri)}
.rowb:hover{background:#f6faff;box-shadow:inset 0 0 0 1px #e4eefc}
.nitem{position:relative}
.nitem:before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:transparent;transition:.16s}
.nitem:hover:before{background:#c9dcfb}
.nitem.on:before{background:var(--pri)}
mark{background:#fff3b0;color:inherit;border-radius:3px;padding:0 2px;box-shadow:0 1px 0 #ffe07a}

.pick{width:30px;height:30px;border-radius:9px;border:2px solid #c9d5e5;background:#f7fafd;display:grid;place-items:center;
  color:#93a3b8;transition:.15s;flex:0 0 auto}
.pick:hover{border-color:var(--pri);color:var(--pri);background:#eef5ff;transform:scale(1.08)}
.pick:active{transform:scale(.94)}
.pick.on{background:var(--pri);border-color:var(--pri);color:#fff}
.pick svg{width:16px;height:16px}
.rowb .s1{cursor:pointer;transition:.14s}
.rowb .s1:hover{color:var(--pri);text-decoration:underline}
.rowb img{cursor:pointer;transition:.18s}
.rowb img:hover{transform:scale(1.07);box-shadow:0 3px 10px rgba(16,24,40,.16)}
.pickcell{display:flex;justify-content:center}

/* 选货单浮条 */
.carthead{padding:11px 14px}
.carthead .t1{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800}
.carthead .t1 .n{font-size:11.5px;font-weight:700;color:var(--pri);background:var(--pri-bg);border-radius:6px;padding:2px 7px}
.carthead .t2{margin-top:7px;font-size:12.5px;color:var(--tx2)}
.carthead .t2 b{font-size:17px;color:var(--pri);font-variant-numeric:tabular-nums}
.carthead .t2 .u{color:var(--tx3)}
.cartgrp{padding:4px 0 2px}
.cartgrp .gh{padding:9px 14px 6px;font-size:12px;font-weight:800;color:var(--tx2);background:#f7f9fc;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);
  display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:2}
.cartgrp .gh .sub{font-weight:700;color:var(--pri);font-variant-numeric:tabular-nums}
.citem{display:grid;grid-template-columns:40px minmax(0,1fr);gap:9px;padding:10px 14px;border-bottom:1px solid var(--line2)}
.citem:hover{background:#fbfcfe}
.citem img{width:40px;height:40px;border-radius:9px;object-fit:cover;background:#eef2f7;display:block}
.citem img.empty{visibility:hidden}
.citem .sp{font-weight:700;font-size:12.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.citem .su{font-size:11px;color:var(--tx3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .row2{display:flex;align-items:center;gap:8px;margin-top:7px}
.citem .qtybox .qbtn{width:24px;height:26px;font-size:14px}
.citem .qtybox .qin{width:56px;height:26px;font-size:12.5px}
.citem .sub{font-size:13px;font-weight:800;color:var(--pri);margin-left:auto;font-variant-numeric:tabular-nums}
.citem .rm{color:var(--tx3);font-size:15px;padding:2px 4px;line-height:1;flex:0 0 auto}
.citem .rm:hover{color:var(--bad)}
.citem .alt{margin-top:6px;font-size:11px;color:var(--ok);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.citem .alt button{font-size:11px;font-weight:800;color:#fff;background:var(--ok);border-radius:6px;padding:2px 7px}
.cartempty{padding:40px 18px;text-align:center;color:var(--tx3);font-size:12.5px;line-height:1.9}
/* 侧边选货单小图标 */
.cartfab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:58;
  display:flex;flex-direction:column;align-items:center;gap:3px;width:66px;padding:11px 0 10px;
  background:linear-gradient(135deg,#1e6ae0,#1554c0);color:#fff;border-radius:13px 0 0 13px;
  box-shadow:-4px 6px 22px rgba(21,84,192,.34);transition:transform .3s cubic-bezier(.2,.9,.2,1),width .2s}
.cartfab.empty{background:linear-gradient(135deg,#8b98ad,#6b7891);box-shadow:-4px 6px 18px rgba(99,113,138,.26)}
.cartfab:hover{width:74px}
.cartfab svg{width:24px;height:24px}
.cartfab .lb{font-size:11.5px;font-weight:800;letter-spacing:.5px}
.cartfab .cnt{font-size:11px;font-weight:800;background:#ffd166;color:#7a3d00;border-radius:9px;padding:1px 7px;min-width:20px;text-align:center;line-height:1.5}
.cartfab .sum{font-size:10.5px;font-weight:700;color:#cfe0ff;font-variant-numeric:tabular-nums;white-space:nowrap}
.cartfab.empty .lb{color:#e3e9f2}
/* 适用酒店星级标签 */
.starchip{display:inline-flex;align-items:center;font-size:10.5px;font-weight:800;border-radius:6px;padding:1.5px 6px;
  background:#fff4e0;color:#a35a00;border:1px solid #f5d9a8;white-space:nowrap;line-height:1.4}
.starchip.mini{font-size:10px;padding:1px 5px;background:#fdf6e8;border-color:#f0dfc0}
@media(max-width:1000px){.cartfab{top:auto;bottom:86px;transform:translateY(0) translateX(110%)}
  .cartfab.on{transform:translateY(0) translateX(0)}}
.basket{position:fixed;left:50%;bottom:14px;transform:translate(-50%,150%);z-index:60;background:#101828;color:#fff;
  border-radius:13px;display:flex;align-items:center;gap:13px;padding:10px 12px 10px 17px;box-shadow:var(--sh2);
  transition:transform .34s cubic-bezier(.2,.9,.2,1);max-width:min(860px,94vw)}
.basket.on{transform:translate(-50%,0)}
.basket .tt{font-size:12.5px;font-weight:700;white-space:nowrap}
.basket .tt b{color:#7dd3fc;font-size:15px;font-variant-numeric:tabular-nums}
.basket .tt .sum{color:#ffd166;font-weight:800;font-variant-numeric:tabular-nums}
.basket .who{display:flex;gap:6px;overflow:hidden;max-width:300px}
.basket .who span{font-size:11.5px;background:rgba(255,255,255,.14);border-radius:6px;padding:3px 8px;white-space:nowrap}
.basket button{background:#fff;color:#101828;border-radius:9px;padding:7px 14px;font-size:12.5px;font-weight:800;transition:.15s}
.basket button:hover{background:#dbe7fb}
.basket .ghost{background:transparent;color:#9fb0c8;font-weight:600;padding:7px 6px}
.basket .ghost:hover{background:transparent;color:#fff}

/* 抽屉 */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,97vw);background:#fff;z-index:75;
  box-shadow:-14px 0 36px rgba(16,24,40,.18);display:flex;flex-direction:column;
  transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.9,.2,1)}
.drawer.on{transform:none}
.drawer .dh{padding:14px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:11px}
.drawer .dh .t{font-size:16px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer .db{flex:1;overflow:auto;padding:13px 18px}
.drawer .df{padding:11px 18px;border-top:1px solid var(--line2);display:flex;gap:9px;justify-content:flex-end;background:#fafbfd}
.backdrop{position:fixed;inset:0;background:rgba(12,20,34,.32);z-index:74;opacity:0;pointer-events:none;transition:.24s}
.backdrop.on{opacity:1;pointer-events:auto}
.mini-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.mini-tbl th{text-align:left;font-size:11px;color:var(--tx3);font-weight:700;padding:6px 8px;background:#f7f9fc;border-bottom:1px solid var(--line);white-space:nowrap}
.mini-tbl td .ibtn{white-space:nowrap}
.mini-tbl th.n,.mini-tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.mini-tbl td{padding:7px 8px;border-bottom:1px solid var(--line2)}
.mini-tbl tr.cur{background:#f0f8ff}
.mini-tbl tr:hover{background:#fafcff}
/* 数量编辑器 */
.qtybox{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.qtybox .qbtn{width:28px;height:30px;background:#f6f8fb;color:var(--pri);font-size:16px;font-weight:800;line-height:1;transition:.14s}
.qtybox .qbtn:hover{background:#e9f1fe}
.qtybox .qbtn:active{transform:scale(.92)}
.qtybox .qin{width:74px;height:30px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);
  text-align:center;font-size:13.5px;font-weight:700;outline:0;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.qtybox .qin::-webkit-outer-spin-button,.qtybox .qin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qtybox .qin:focus{background:#f0f7ff}
.qmul{font-size:10.5px;color:var(--tx3);margin-top:3px;text-align:center}

/* 价格双滑块 */
.pfilter{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--tx3)}
.range{position:relative;width:158px;height:22px;flex:0 0 auto}
.range .track{position:absolute;left:0;right:0;top:9px;height:4px;background:#e5eaf1;border-radius:2px}
.range .fill{position:absolute;top:9px;height:4px;background:var(--pri);border-radius:2px;pointer-events:none}
.range input{position:absolute;left:0;top:0;width:100%;height:22px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none;outline:0}
.range input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:#fff;border:2px solid var(--pri);box-shadow:0 1px 4px rgba(16,24,40,.25);cursor:grab}
.range input::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.12)}
.range input::-moz-range-thumb{pointer-events:auto;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--pri);cursor:grab}

.toast{position:fixed;left:50%;bottom:70px;transform:translate(-50%,20px);background:#101828;color:#fff;border-radius:10px;
  padding:10px 18px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.24s;z-index:90}
.toast.on{opacity:1;transform:translate(-50%,0)}
.datastatus{position:fixed;left:50%;top:14px;transform:translate(-50%,-160%);z-index:92;background:#101828;color:#fff;
  border-radius:10px;padding:9px 16px;font-size:12.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.28);
  transition:transform .3s cubic-bezier(.2,.9,.2,1);max-width:92vw;text-align:center}
.datastatus.on{transform:translate(-50%,0)}
.datastatus button{margin-left:8px;background:#fff;color:#101828;border-radius:7px;padding:4px 12px;font-size:12px;font-weight:800}
/* 图片放大预览 */
img.zoom{cursor:zoom-in}
img.zoom:hover{box-shadow:0 0 0 2px var(--pri),0 4px 14px rgba(16,24,40,.2)}
.lightbox{position:fixed;inset:0;z-index:95;background:rgba(8,12,20,.88);display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;padding:24px;opacity:0;pointer-events:none;transition:.22s}
.lightbox.on{opacity:1;pointer-events:auto}
.lightbox img{max-width:92vw;max-height:82vh;border-radius:12px;background:#fff;box-shadow:0 26px 70px rgba(0,0,0,.55);
  transform:scale(.94);transition:.26s cubic-bezier(.2,.9,.2,1)}
.lightbox.on img{transform:none}
.lightbox .cap{color:#e6eefb;font-size:13.5px;text-align:center;max-width:80vw;line-height:1.7}
.lightbox .cap b{color:#fff}
.lightbox .x{position:absolute;top:16px;right:20px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);
  color:#fff;font-size:22px;line-height:1;display:grid;place-items:center;transition:.16s}
.lightbox .x:hover{background:rgba(255,255,255,.26)}
.toast{position:fixed;left:50%;bottom:70px;transform:translate(-50%,20px);background:#101828;color:#fff;border-radius:10px;
  padding:10px 18px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.24s;z-index:90}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ============ 移动端：恢复自然高度 + 底栏 ============ */

  html,body{height:auto;overflow:auto}

  .rowb .ppx,.rowb .mqx{display:none}

  .rowb img{width:60px;height:60px}
  /* 再压一档：跳转只留一行、支付标签手机上省掉 */

  .rowb .s2row{flex-wrap:nowrap;gap:6px;overflow:hidden}

  /* 顶栏瘦身：不换行、去掉重复搜索框与多余的说明 */

  .thead{display:none}

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const unent=s=>String(s??'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
  .replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&nbsp;/g,' ');
const esc=s=>unent(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=n=>Number(n||0).toLocaleString('zh-CN');
/* 单价统一保留两位；只有小到会被四舍五入成 0.00 的（如 0.0024 元/抽）才多留两位，免得看不出差别 */
const money=v=>{
  if(v==null) return '—';
  if(v>=1000) return v.toFixed(0);
  const s=v.toFixed(2);
  if(parseFloat(s)===0&&v>0) return v.toFixed(4);
  return s;
};
const fx=v=>v==null?'—':'¥'+money(v);
const TW=[60,100,160,180,200,300,400,500,600,800];
const snapW=w=>TW.reduce((a,b)=>Math.abs(b-w)<Math.abs(a-w)?b:a,TW[0]);
const thumb=(u,w)=>{ if(!u) return ''; if(/_W_\d+_\d+/.test(u)) return u;
  return u.replace(/\.(jpe?g|png|webp)(\?|$)/i,(m,e)=>`_W_${snapW(w||100)}_0.${e}`); };
const imgTag=(u,w,cls,cap)=>{ if(!u) return '<img class="empty">';
  return `<img class="${cls||''}" ${cap?`data-cap="${esc(cap)}"`:''} loading="lazy" src="${esc(thumb(u,w||100))}" data-o="${esc(u)}"
    onerror="if(this.dataset.f){this.classList.add('empty')}else{this.dataset.f='1';this.src=this.dataset.o}">`; };
function pieceWord(name){
  const m=String(name||'').match(/\d+(?:\.\d+)?\s*[*×xX]?\s*(瓶|支|条|包|卷|个|只|双|袋|盒|抽|张|片|桶|提|件|套|块|罐|听|颗)/);
  return m?m[1]:'件';
}
function baseWords(b){
  const m=String(b||'元/件').match(/^元\/(.+)$/); const u=m?m[1]:'件';
  return {short:u,long:'每'+({'100ml':'100毫升','100g':'100克'}[u]||u)};
}
const supName=i=>{ const a=ROWS&&ROWS.sups?ROWS.sups[i]:null;
  if(typeof a==='string'&&a) return a;
  const b=SUM&&SUM.sups?SUM.sups[i]:null; return (b&&b.name)||String(b||'')||'（未知供应商）'; };
/* 携程服务市场商品页（实测格式：/hmall/product/detail/{id}） */
const ctripURL=id=>`https://ebooking.ctrip.com/hmall/product/detail/${id}`;
const EXT_SVG='<svg viewBox="0 0 16 16" fill="none"><path d="M6.5 3H13v6.5M13 3L6.5 9.5M11 9.5V13H3V5h3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ctripLink=(id,name)=>`<a href="${ctripURL(id)}" target="_blank" rel="noopener" title="在携程服务市场打开这个商品">${esc(name)}</a>${EXT_SVG}`;
/* 支付方式：现金一定有；其余按接口返回的可用标记
   prods[6] = 四位串 freeRoom / prepay / commission / zeroBuy */
const PAY_DEF=[['freeRoom','免房支付'],['prepay','预付分期'],['commission','客房分成'],['zeroBuy','0元购']];
function payChips(pi,compact){
  const bits=String(ROWS.prods[pi][6]||'0000');
  const extra=[];
  PAY_DEF.forEach(([k,label],i)=>{ if(bits[i]==='1') extra.push(label); });
  if(compact) return extra.length?`<span class="paychips">${extra.map(x=>`<span class="paychip syt">可用${x}</span>`).join('')}</span>`:'';
  return `<span class="paychips"><span class="paychip syt">生意通支付</span><span class="paychip">现金</span>`
    + extra.map(x=>`<span class="paychip syt">${x}</span>`).join('')
    + `</span>`;
}
/* 商品是否有「特殊支付方式」（免房/预付分期/客房分成/0元购） */
const hasPay=pi=>/[1]/.test(String(ROWS.prods[pi][6]||'0000'));
/* 适用酒店星级（来自商品参数「适用酒店」） */
const starOf=pi=>String((ROWS.prods[pi]||[])[7]||'');
const STAR_TIP={'0-2星':'经济型 / 低星','0-3星':'中低星','2-4星':'中档','3-4星':'中高星','3-5星':'高星'};
function starChip(pi,compact){
  const s=starOf(pi); if(!s) return '';
  const tip=STAR_TIP[s]?`${s} · ${STAR_TIP[s]}`:s;
  return `<span class="starchip${compact?' mini':''}" title="适用酒店：${esc(tip)}">${esc(s)}</span>`;
}

/* ---------- 关键词高亮 ---------- */
/* ---------- 价格筛选（对数刻度双滑块） ---------- */
const PRICE=new Map();     // ci -> [lo%, hi%]
function priceBounds(c){
  const vs=(catRows(c.i)||[]).map(i=>ROWS.rows[i]).filter(r=>r[6]==='rank').map(r=>r[5]);
  if(vs.length<3) return null;
  return {lo:Math.min(...vs), hi:Math.max(...vs)};
}
function priceRange(c){
  const b=priceBounds(c); if(!b) return null;
  let pr=PRICE.get(c.i); if(!pr){ pr=[0,100]; PRICE.set(c.i,pr); }
  return {b, pr};
}
const posOf=(b,v)=>{ const a=Math.log10(b.lo), z=b.hi>b.lo?Math.log10(b.hi):a+0.001;
  return Math.max(0,Math.min(100,(Math.log10(Math.max(v,b.lo))-a)/(z-a)*100)); };
const valAt=(b,t)=>{ const a=Math.log10(b.lo), z=b.hi>b.lo?Math.log10(b.hi):a+0.001; return Math.pow(10,a+(z-a)*t/100); };
function inPrice(c,v){
  const r=priceRange(c); if(!r) return true;
  if(r.pr[0]<=0&&r.pr[1]>=100) return true;
  const t=posOf(r.b,v);
  return t>=r.pr[0]-0.5&&t<=r.pr[1]+0.5;
}

function hl(text,q){
  const s=esc(text);
  if(!q) return s;
  const qq=unent(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

/* ---------- 排序动画（FLIP） ---------- */
function flip(container,selector,renderFn){
  const before=new Map();
  container.querySelectorAll(selector).forEach(el=>{
    const k=el.dataset.k; if(k) before.set(k,el.getBoundingClientRect().top);
  });
  renderFn();
  container.querySelectorAll(selector).forEach(el=>{
    const t0=before.get(el.dataset.k);
    if(t0==null) return;
    const d=t0-el.getBoundingClientRect().top;
    if(Math.abs(d)>2) el.animate([{transform:`translateY(${d}px)`},{transform:'none'}],
      {duration:330,easing:'cubic-bezier(.2,.8,.25,1)'});
  });
}

function pageOf(k,total){ const per=perOf(k), max=Math.max(1,Math.ceil(total/per));
  let p=PAGE.get(k)||1; if(p>max)p=max; if(p<1)p=1; PAGE.set(k,p); return p; }
function pagerHTML(k,total,unit){

  if(total<=per) return `<div class="pgbar"><span>共 <b>${nf(total)}</b> ${unit}</span>${perSel}</div>`;
  const nums=[],win=2;
  for(let i=1;i<=max;i++){ if(i===1||i===max||Math.abs(i-p)<=win) nums.push(i);
    else if(nums[nums.length-1]!=='…') nums.push('…'); }
  return `<div class="pgbar"><span>共 <b>${nf(total)}</b> ${unit} · 第 <b>${p}</b>/${max} 页</span>${perSel}
    ${jump}

      <button class="pg" data-pg="${k}|${p+1}" ${p>=max?'disabled':''}>下一页</button>

}

/* 联想：品类 + 商品/规格 */
function homeSuggest(q){
  q=q.trim(); const out=[]; if(!q) return out;
  const ql=q.toLowerCase();
  SUM.cats.filter(c=>c.leaf.toLowerCase().includes(ql)).slice(0,5)
    .forEach(c=>out.push({type:'cat',i:c.i,label:c.leaf,
      sub:`${c.sups} 家供应商 · ${nf(c.rankable)} 个可比规格`,
      right:c.min==null?'':fx(c.min)+baseWords(c.base).long}));
  let n=0;
  for(let i=0;i<ROWS.rows.length&&n<7;i++){
    const r=ROWS.rows[i]; if(r[6]!=='rank') continue;
    const P=ROWS.prods[r[0]], c=SUM.cats.find(x=>x.i===P[2]);
    if(!(String(r[1]).toLowerCase().includes(ql)||String(P[0]).toLowerCase().includes(ql))) continue;
    out.push({type:'sku',pI:r[0],cat:c.i,label:r[1],
      sub:`${c.leaf} · ${supName(P[1])} · ${fx(parseFloat(r[2]))}/${pieceWord(r[1])}`,
      right:fx(r[5])+'/'+baseWords(c.base).short});
    n++;
  }
  return out;
}

function fillSelect(el,list,val,allText){

function renderCascade(){
  const e1=$('#selL1'), e2=$('#selL2'), e3=$('#selL3'); if(!e1) return;
  const cats=SUM.cats.filter(c=>!/^(试用专区|其他)$/.test(lv1Of(c)));
  const l1s=[...new Set(cats.map(lv1Of))].sort((a,b)=>cats.filter(c=>lv1Of(c)===b).length-cats.filter(c=>lv1Of(c)===a).length);
  fillSelect(e1,l1s,L1,'全部分类');
  const scope1=L1?cats.filter(c=>lv1Of(c)===L1):cats;
  const l2s=[...new Set(scope1.map(lv2Of))].sort((a,b)=>scope1.filter(c=>lv2Of(c)===b).length-scope1.filter(c=>lv2Of(c)===a).length);
  fillSelect(e2,l2s,L2,L1?(L1+'：全部'):'全部');
  const scope2=L2?scope1.filter(c=>lv2Of(c)===L2):scope1;
  const l3s=[...new Set(scope2.map(c=>c.leaf))].sort((a,b)=>(scope2.find(c=>c.leaf===b)||{}).rankable-(scope2.find(c=>c.leaf===a)||{}).rankable);
  fillSelect(e3,l3s,L3,(L2||L1||'全部')+'：全部品类');
  e2.disabled=!l1s.length;
  e3.disabled=!l3s.length;
}
function navList(){

  const q=CATQ(); if(q) list=list.filter(c=>c.leaf.includes(q)||c.lv2.includes(q));
  if($('.mini[data-f=only3]').classList.contains('on')) list=list.filter(c=>c.sups>=3);
  if($('.mini[data-f=cheapstart]').classList.contains('on')) list=list.filter(catCheapStart);
  if($('.mini[data-f=pay]').classList.contains('on')) list=list.filter(catHasPay);
  if(STAR) list=list.filter(catHasStar);
  if($('.mini[data-f=trial]').classList.contains('on')) list=list.filter(catHasTrial);
  if(CATSORT==='cat'){ const ord=lv2Order();
    list.sort((a,b)=>(ord.indexOf(a.lv2)-ord.indexOf(b.lv2))||(b.rankable-a.rankable)||(a.i-b.i)); }
  else if(CATSORT==='spread') list.sort((a,b)=>(b.spread||0)-(a.spread||0)||b.rankable-a.rankable);
  else if(CATSORT==='rankable') list.sort((a,b)=>b.rankable-a.rankable);
  else if(CATSORT==='sups') list.sort((a,b)=>b.sups-a.sups);
  else if(CATSORT==='min') list.sort((a,b)=>(a.min??1e9)-(b.min??1e9));
  return list;
}

}

function bandHTML(vs,c){
  if(!vs.length) return '';
  const mn=Math.min(...vs),mx=Math.max(...vs);
  const a=Math.log10(mn),b=mx>mn?Math.log10(mx):a+0.001;
  const pos=v=>Math.max(0,Math.min(100,(Math.log10(v)-a)/(b-a)*100));
  const uniq=[...new Set(vs)].sort((x,y)=>x-y);
  const show=uniq.length<=44?uniq:uniq.filter((_,i)=>i%Math.ceil(uniq.length/44)===0);
  const pr=c&&priceRange(c)?priceRange(c).pr:[0,100];
  const on=!(pr[0]<=0&&pr[1]>=100);
  const b0=c?priceRange(c).b:null;
  return `<div class="band" id="bandEl" title="拖动两端筛选价格区间">
      <span class="hint">可拖动筛选</span>
      <div class="viz">${show.map(v=>`<i class="${v===mn?'lo':''}" style="left:${pos(v).toFixed(1)}%"></i>`).join('')}</div>
      <div class="sel" id="bandSel" style="left:${pr[0]}%;width:${Math.max(0,pr[1]-pr[0])}%"></div>
      <input type="range" id="b1" min="0" max="100" value="${pr[0]}" aria-label="价格下限">
      <input type="range" id="b2" min="0" max="100" value="${pr[1]}" aria-label="价格上限">
      <span class="hit"></span>
    </div>
    <div class="ax"><span id="axLo">${on&&b0?fx(valAt(b0,pr[0])):'最低 '+fx(mn)}</span>
      <span id="axHi">${on&&b0?fx(valAt(b0,pr[1])):(mx>mn*1.05?'最高 '+fx(mx):'')}</span></div>`;
}

/* ===== 表头排序（每列都可升/降） ===== */
const SORT_COLS={
  unit:{label:'换算单价', get:r=>r[5]},
  piece:{label:'每件价', get:r=>(r[7]!=null?Number(r[7]):parseFloat(r[2]))||0},
  mq:{label:'起订量', get:r=>Number(r[4])||0},
  least:{label:'最少花', get:r=>(parseFloat(r[2])||0)*(Number(r[4])||1)},
  spec:{label:'规格名', get:r=>String(r[1]||''), text:true},
  sup:{label:'供应商', get:r=>supName(ROWS.prods[r[0]][1]), text:true},
};
function sortSkuRows(rows){
  const col=(SORT_COLS[SKUSORT.col]?SKUSORT.col:'unit'), dir=SKUSORT.dir, g=SORT_COLS[col].get;
  const isText=!!SORT_COLS[col].text;
  const a=rows.slice();
  a.sort((x,y)=>{
    const vx=g(x), vy=g(y);
    let c = isText ? String(vx).localeCompare(String(vy),'zh') : (vx-vy);
    if(!c) c = x[5]-y[5];
    return c*dir;
  });
  return a;
}
function skuTheadHTML(){
  const cell=(k,txt,cls)=>{
    const on=k&&SKUSORT.col===k;
    return `<span class="${cls||''}">${k
      ? `<b class="th-sort ${on?'on':''}" data-col="${k}" title="点一下排序，再点切换升序/降序">${txt}<span class="arr">${on?(SKUSORT.dir===1?'▲':'▼'):'⇅'}</span></b>`
      : ''}</span>`;
  };
  return `<div class="thead">${cell('','')}${cell('unit','换算单价')}${cell('','')}${cell('spec','规格名')}`
    + `${cell('piece','每件价','n')}${cell('mq','起订量','n')}${cell('least','最少花','n')}${cell('sup','供应商')}</div>`;
}

function bindCatEvents(){
  $$('#viewseg button').forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;renderCat();saveState();});
  const inp=$('#skuq');
  if(inp) inp.oninput=()=>{Q=inp.value;PAGE.set('sku:'+CAT,1);
    const y=$('#catbody').scrollTop; renderBody(); $('#catbody').scrollTop=y;};
  // 价格带拖动：直接拖品类头部那条价格带
  const r1=$('#b1'), r2=$('#b2');
  if(r1&&r2){
    const paint=()=>{                       // 只刷新外观，绝不重置页码
      const cc=curCat(); if(!cc) return;
      const pr=priceRange(cc); if(!pr) return;
      r1.value=pr.pr[0]; r2.value=pr.pr[1];
      const sel=$('#bandSel'); if(sel){ sel.style.left=pr.pr[0]+'%'; sel.style.width=Math.max(0,pr.pr[1]-pr.pr[0])+'%'; }
    };
    const move=(from)=>{                    // 拖动才重置第 1 页并重绘列表
      let a=Number(r1.value), b2=Number(r2.value);
      if(a>b2-3){ if(from==='1') a=b2-3; else b2=a+3; }
      if(a<0)a=0; if(b2>100)b2=100;
      r1.value=a; r2.value=b2;
      PRICE.set(CAT,[a,b2]);
      const c=curCat(), pr=priceRange(c);
      const sel=$('#bandSel'); if(sel){ sel.style.left=a+'%'; sel.style.width=Math.max(0,b2-a)+'%'; }
      const on=!(a<=0&&b2>=100);
      const lo=$('#axLo'), hi=$('#axHi');
      if(lo) lo.innerHTML=on?`<b>${fx(valAt(pr.b,a))}</b>`:'最低 '+fx(pr.b.lo);
      if(hi) hi.innerHTML=on?`<b>${fx(valAt(pr.b,b2))}</b>`:(pr.b.hi>pr.b.lo*1.05?'最高 '+fx(pr.b.hi):'');
      PAGE.set('sku:'+CAT,1);
      const y=$('#catbody').scrollTop; renderBody(); $('#catbody').scrollTop=y;
    };
    r1.oninput=()=>move('1'); r2.oninput=()=>move('2');
    paint();
    /* 整条价格带都能拖：按下位置离哪个把手近就拖哪个 */
    const band=$('#bandEl');
    if(band){
      const pct=e=>{ const R=band.getBoundingClientRect(); return Math.max(0,Math.min(100,(e.clientX-R.left)/R.width*100)); };
      let hold=null;
      const setOne=(which,p)=>{
        let a=Number(r1.value), b2=Number(r2.value);
        if(which==='lo'){ a=Math.min(p,b2-3); if(a<0)a=0; }
        else { b2=Math.max(p,a+3); if(b2>100)b2=100; }
        r1.value=a; r2.value=b2; move(which==='lo'?'1':'2');
      };
      band.addEventListener('pointerdown',e=>{
        const p=pct(e), a=Number(r1.value), b2=Number(r2.value);
        hold = (Math.abs(p-a)<=Math.abs(p-b2)) ? 'lo' : 'hi';
        try{ band.setPointerCapture(e.pointerId); }catch(err){}
        setOne(hold,p); e.preventDefault();
      });
      band.addEventListener('pointermove',e=>{ if(hold) setOne(hold,pct(e)); });
      const end=()=>{ hold=null; };
      band.addEventListener('pointerup',end);
      band.addEventListener('pointercancel',end);
      band.addEventListener('mouseleave',()=>{ hold=null; });
    }
  }
}

/* ================= 交互事件（全局委托） ================= */
document.addEventListener('click',e=>{
  /* 「共 N 档」展开 / 收起该商品的全部档位 */
  const ex=e.target.closest('[data-exp]');
  if(ex){
    e.stopPropagation();
    const p=+ex.dataset.exp;
    EXP.has(p)?EXP.delete(p):EXP.add(p);
    const y=$('#catbody').scrollTop; renderCat(); $('#catbody').scrollTop=y;
    return;
  }
  /* 搜索历史下拉：单条删除 / 关闭历史 / 删除历史 / 更多历史 */
  const hd=e.target.closest('[data-hdel]');
  if(hd){ e.stopPropagation(); e.preventDefault(); histDel(unent(hd.dataset.hdel)); return; }
  if(e.target.closest('[data-hclear]')){ e.stopPropagation(); HIST=[]; try{localStorage.removeItem(HKEY);}catch(err){}
    HIST_ALL=false; renderHist(); renderHDrop(); renderTDrop(); toast('搜索历史已清空'); return; }
  if(e.target.closest('[data-hclose]')){ e.stopPropagation(); openSet(); return; }   // 同百度：打开搜索设置
  if(e.target.closest('[data-hmore]')){ e.stopPropagation(); HIST_ALL=!HIST_ALL; renderHDrop(); renderTDrop(); return; }
  const hr=e.target.closest('.hrow');
  if(hr){ e.stopPropagation(); HIST_ALL=false; homeGo(unent(hr.dataset.hq)); return; }
  // 表头排序：点一下按该列升序，再点切降序
  const z=e.target.closest('img.zoom');
  if(z){ e.stopPropagation(); openLB(z.dataset.o||z.src, z.dataset.cap||''); return; }
  const th=e.target.closest('.th-sort');
  if(th){
    e.stopPropagation();
    const k=th.dataset.col;
    if(SKUSORT.col===k) SKUSORT.dir=-SKUSORT.dir; else { SKUSORT.col=k; SKUSORT.dir=1; }
    if(MODE==='search') PAGE.set('gsearch',1); else PAGE.set('sku:'+CAT,1);
    renderCat();
    saveState();
    return;
  }
  // 加入 / 移除选货单
  const pk=e.target.closest('.pick');
  if(pk){
    e.stopPropagation();
    const b=pk.dataset.bk;
    if(pk.classList.contains('on')||BK.has(b)){
      BK.delete(b); renderBasket();
      document.querySelectorAll('.pick').forEach(x=>{ if(x.dataset.bk===b){
        x.classList.remove('on');
        x.innerHTML='<svg viewBox="0 0 16 16" fill="none"><path d="M8 3.2v9.6M3.2 8h9.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
      }});
      toast('已从选货单移除');
    } else {
      const dc=+pk.dataset.cat;
      const r=ROWS.rows.find(x=>x[0]==+pk.dataset.p&&x[1]===unent(pk.dataset.spec));
      bkAdd({ key:b, p:+pk.dataset.p, spec:unent(pk.dataset.spec), list:parseFloat(pk.dataset.list)||0,
        mq:Number(pk.dataset.mq)||1, piece:parseFloat(pk.dataset.piece)||0,
        sup:supName(+pk.dataset.sup), cat:(SUM.cats.find(c=>c.i===dc)||{}).leaf||'', img:pk.dataset.img });
      pk.classList.add('on'); pk.classList.add('pop');
      pk.innerHTML='<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.4 3.4L13 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      setTimeout(()=>pk.classList.remove('pop'),240);
      toast('已加入选货单');
    }
    return;
  }
  // 打开商品详情（看档位）
  const op=e.target.closest('[data-tiers]');
  if(op){ e.stopPropagation(); openProd(+op.dataset.tiers); return; }
  // 抽屉内移除 / 导出
  const del=e.target.closest('[data-bkdel]');
  if(del){ bkDel(unent(del.dataset.bkdel)); openBasket(); toast('已移除'); return; }
  // 数量 ± （按起订量步进）
  const st=e.target.closest('[data-qstep]');
  if(st){
    const [k,dir]=st.dataset.qstep.split(':'); const key=unent(k);
    const o=BK.get(key); if(o){ const mq=Math.max(1,Number(o.mq)||1);
      setQty(key,(o.qty||mq)+(dir==='1'?mq:-mq)); }
    return;
  }
  const cp=e.target.closest('[data-bkcopy]');
  if(cp){ copyBasket(); return; }
  const cv=e.target.closest('[data-bkcsv]');
  if(cv){ csvBasket(); return; }
});
/* ---------- 选货单导出 ---------- */
function basketRows(){
  let sum=0; const arr=[...BK.values()];
  arr.forEach(o=>sum+=o.piece*(o.qty||o.mq||1));
  return {arr,sum};
}
function copyBasket(){
  const {arr,sum}=basketRows();
  const txt='选货单（携程服务市场）\n'+arr.map(o=>`${o.spec}\t${o.sup}\t每件${fx(o.piece)}\t起订${o.mq}\t数量${o.qty||o.mq}\t小计${fx(o.piece*(o.qty||o.mq||1))}`).join('\n')+`\n合计\t${fx(sum)}`;
  navigator.clipboard?.writeText(txt).then(()=>toast('已复制选货单')).catch(()=>toast('复制失败'));
}
function csvBasket(){
  const {arr,sum}=basketRows();
  const head=['品类','规格名','供应商','每件价','起订量','采购数量','小计'];
  const lines=[head].concat(arr.map(o=>[o.cat,o.spec,o.sup,o.piece,o.mq,o.qty||o.mq,o.piece*(o.qty||o.mq||1)]));
  lines.push(['','','','','','合计',sum]);
  const csv='\ufeff'+lines.map(l=>l.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='选货单.csv'; a.click();
  toast('已导出 CSV');
}

/* ================= 供应商 ================= */
function renderSup(sI){
  idx(); const s=SUM.sups[sI]; if(!s) return;
  const rows=[];
  SUM.cats.forEach(c=>{const r=c.rows.find(x=>x.s===sI); if(r) rows.push({c,r,ci:c.i});});
  if(SUPSORT==='prods') rows.sort((a,b)=>b.r.prods-a.r.prods);
  else if(SUPSORT==='skus') rows.sort((a,b)=>b.r.skus-a.r.skus);
  else rows.sort((a,b)=>((a.r.min??1e9)/((a.c.min??1e9)||1))-((b.r.min??1e9)/((b.c.min??1e9)||1)));
  const key='sup:'+sI, shown=slicePage(key,rows);
  $('#supbody').innerHTML=`<div class="suphero"><span class="nm">${esc(s.name)}</span>
      <span class="badge b-base">覆盖 ${s.cats} 个品类</span><span class="badge b-mute">商品 ${s.prods}</span><span class="badge b-mute">规格 ${nf(s.skus)}</span>
      ${s.trial?`<span class="badge b-trial">${s.trial} 款可0元试用</span>`:''}
      <span style="margin-left:auto;font-size:12px;color:var(--tx3)">点任意一行跳到该品类</span></div>
    <div class="thead t"><span>品类</span><span class="n">商品</span><span class="n">规格</span><span class="n">该家最低单价</span><span class="n">品类最低</span><span>价格水位</span></div>`
    + shown.map(({c,r,ci})=>{
      const ratio=(r.min!=null&&c.min)?r.min/c.min:null;
      const col=ratio==null?'#cbd3de':ratio<=1.02?'linear-gradient(90deg,#34d399,#0a7c53)':ratio<=1.3?'linear-gradient(90deg,#fcd34d,#e08c00)':'linear-gradient(90deg,#fb9b8f,#c0392b)';
      const w=ratio==null?0:Math.max(8,Math.min(100,Math.round(100*Math.pow(1/ratio,.7))));
      return `<div class="trow ${ratio!=null&&ratio<=1.02?'low':''}" data-jump="${ci}" style="cursor:pointer">
        <span><b>${esc(c.leaf)}</b> <span class="badge b-mute">按${esc(baseWords(c.base).long)}</span></span>
        <span class="n">${r.prods}</span><span class="n">${r.skus}</span>
        <span class="n">${r.min==null?'—':`<b style="font-size:14px">${fx(r.min)}</b>`}</span>
        <span class="n" style="color:var(--tx3)">${c.min==null?'—':fx(c.min)}</span>
        <span style="display:flex;align-items:center;gap:8px"><span style="height:8px;border-radius:5px;background:${col};width:${w}px;min-width:8px"></div>
          <span style="font-size:11.5px;color:var(--tx3)">${ratio==null?'不可比':ratio<=1.02?'最低':'贵 '+ratio.toFixed(2)+'×'}</span></span>
      </div>`;}).join('');
  $('#supfoot').innerHTML=pagerHTML(key,rows.length,'个品类');
  $$('#supbody .trow[data-jump]').forEach(el=>el.onclick=()=>{selectCat(+el.dataset.jump);tab('cats');});
}

const palOpen=()=>{$('#pal').classList.add('on');$('#palq').focus();palRender();};
const palClose=()=>$('#pal').classList.remove('on');
function palRender(){
  idx();
  const q=$('#palq').value.trim().toLowerCase();
  if(!q){
    $('#palres').innerHTML='<div class="sep">试试这些品类</div>'+['牙具','拖鞋','大瓶洗沐','卷纸','抽纸/擦手纸','全套洗漱','香皂','洗手液'].map(x=>{
      const c=SUM.cats.find(k=>k.leaf===x); if(!c) return '';
      return `<div class="pit" data-cat="${c.i}"><div class="tx"><div class="a">${esc(c.leaf)}</div>
        <div class="b">${c.sups} 家供应商 · ${nf(c.rankable)} 个可比规格${c.spread?' · 价格差距 '+c.spread.toFixed(1)+'×':''}</div></div>
        <div class="c">${c.min==null?'':fx(c.min)+baseWords(c.base).long}</div></div>`;}).join('');
    return;
  }
  const cats=SUM.cats.filter(c=>c.leaf.toLowerCase().includes(q)).slice(0,5)
    .map(c=>`<div class="pit" data-cat="${c.i}"><div class="tx"><div class="a">${esc(c.leaf)} <span class="badge b-base">按${esc(baseWords(c.base).long)}</span></div>
      <div class="b">${c.sups} 家供应商 · ${nf(c.rankable)} 个可比规格</div></div><div class="c">${c.min==null?'':fx(c.min)}</div></div>`).join('');
  const sups=SUM.sups.map((s,i)=>({s,i})).filter(x=>x.s.name.toLowerCase().includes(q)).slice(0,4)
    .map(({s,i})=>`<div class="pit" data-sup="${i}"><div class="tx"><div class="a">${esc(s.name)}</div><div class="b">覆盖 ${s.cats} 个品类 · ${nf(s.skus)} 个规格</div></div></div>`).join('');
  const hits=[];
  for(let i=0;i<ROWS.rows.length&&hits.length<12;i++){
    const r=ROWS.rows[i],P=ROWS.prods[r[0]];
    if(String(r[1]).toLowerCase().includes(q)||String(P[0]).toLowerCase().includes(q)) hits.push(i);
  }
  const hp=hits.map(i=>{const r=ROWS.rows[i],P=ROWS.prods[r[0]],c=SUM.cats.find(x=>x.i===P[2]),pw=pieceWord(r[1]),mq=Number(r[4])||1;
    const lp=parseFloat(r[2])||0, pp=r[7]!=null?Number(r[7]):lp, isPack=pp>0&&pp<lp-1e-9;
    return `<div class="pit" data-prod="${r[0]}" data-cat="${P[2]}">${imgTag(P[3],100)}<div class="tx">
      <div class="a">${esc(r[1])}</div><div class="b">${esc(supName(P[1]))} · ${esc(c?c.leaf:'')} · ${fx(pp)}/${esc(pw)}${isPack?'（整包 '+fx(lp)+'）':''} · 起订${r[4]==null?'-':nf(r[4])} · 最少 ${fx(lp*mq)}</div></div>
      <div class="c">${r[6]==='rank'?fx(r[5]):r[6]==='trial'?'可0元试用':'按件'}</div></div>`;}).join('');
  $('#palres').innerHTML=(cats?`<div class="sep">品类</div>${cats}`:'')+(sups?`<div class="sep">供应商</div>${sups}`:'')
    +(hp?`<div class="sep">商品 / 规格</div>${hp}`:'')||`<div class="empty">没有找到「${esc(q)}」</div>`;
  $$('#palres .pit').forEach(el=>el.onclick=()=>{
    if(el.dataset.cat!=null){ selectCat(+el.dataset.cat); tab('cats'); }
    else if(el.dataset.sup!=null){ tab('sups'); $('#supsel').value=el.dataset.sup; renderSup(+el.dataset.sup); }
    palClose();
  });
}

/* ================= 载入 ================= */
async function fetchJSON(url,tries){
  tries=tries||3; let err;
  for(let i=0;i<tries;i++){
    try{
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      return await r.json();
    }catch(e){ err=e; if(i<tries-1) await new Promise(z=>setTimeout(z,700*(i+1))); }
  }
  throw err;
}
function setDataStatus(txt,retry){
  const el=$('#dataStatus'); if(!el) return;
  el.classList.toggle('on',!!txt);
  el.innerHTML = txt ? (retry?`${txt} <button id="dsRetry">重试</button>`:txt) : '';
  if(retry&&$('#dsRetry')) $('#dsRetry').onclick=retry;
}
/* 先加载汇总（0.3MB）渲染外壳，再后台拉明细（6.6MB），手机上不会白屏 */
(async function(){
  try{
    SUM=await fetchJSON('data/site-summary.json',4);
  }catch(e){
    $('#topmeta').textContent='汇总数据加载失败，请刷新重试';
    setDataStatus('汇总数据加载失败：'+e.message, ()=>location.reload());
    return;
  }
  boot();
  loadRows();
})();
async function loadRows(){
  setDataStatus('正在加载明细数据…（首次约 1~3 秒）');
  try{
    const b=await fetchJSON('data/site-rows.json',4);
    ROWS=b; TRIAL=new Set(b.trialProd||[]); TAGS=new Map(b.tags||[]);
    ROWS_READY=true;
    idx();                            // 明细到手就建索引（否则列表会是空的）
    setDataStatus('');
    _trialByCat=null; _ct.clear();
    if(CURV==='cats'){ if(MODE==='search') renderSearch(); else if(curCat()) renderCat(); }
  }catch(e){
    setDataStatus('明细数据加载失败（可能是网络不稳）：'+e.message, ()=>loadRows());
  }
}
